name: CI

# Roof HR had no CI at all before this. The typecheck script and the oxlint
# config both existed and both were red, which is how ~120 type errors and 195
# lint errors accumulated unnoticed.
#
# The gate is a ratchet, not a wall: it fails when the error count goes UP
# against .quality-baseline.json, and rewrites the baseline downward when it
# goes down. See scripts/quality-gate.mjs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The integration runner resets this disposable database, never production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: roofhr-ci-only
          POSTGRES_DB: roofhr_test_mcp21
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Must pass outright. A broken build is never acceptable.
      - name: Build
        run: npm run build

      # Must pass outright. Both suites are green today; keep them that way.
      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:roofhr-ci-only@127.0.0.1:5432/roofhr_test_mcp21

      - name: Integration startup diagnostics
        if: failure()
        run: |
          if test -f /tmp/roofhr-test-server.log; then
            tail -n 100 /tmp/roofhr-test-server.log
          fi

      # Ratchet: fails only if lint or type errors increased.
      - name: Quality gate
        run: npm run gate

      # Informational until the inherited backlog is cleared. Read the log.
      - name: Lint report
        if: always()
        continue-on-error: true
        run: npm run lint
