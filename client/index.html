<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: pinch-zoom must work (WCAG 2.2 SC 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Roof HR</title>
    <meta name="description" content="Roof-ER HR: recruiting, employees, PTO, onboarding and documents." />
    <meta name="theme-color" content="#B60807" />
    <link rel="icon" href="/icons/icon-32.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Fonts are linked here, not @import-ed from the stylesheet, so the
         request starts immediately instead of waiting for 127KB of CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Roof HR needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
